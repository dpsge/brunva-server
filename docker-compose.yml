services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brunva
      POSTGRES_PASSWORD: brunva
      POSTGRES_DB: brunva
    ports:
      - "5432:5432"
    volumes:
      - brunva_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brunva -d brunva"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brunva_postgres:
